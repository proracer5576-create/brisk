<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b66">
  <title>지식샘터 자료 허브</title>
  <style>
    :root {
      --navy: #123b66;
      --deep: #0b2847;
      --blue: #1667b1;
      --mint: #13a987;
      --ink: #172536;
      --muted: #5c6d7f;
      --line: #d9e2eb;
      --paper: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0, rgba(22,103,177,.12), transparent 28rem),
        linear-gradient(180deg, #fafdff, #f5f2eb);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      line-height: 1.65;
      word-break: keep-all;
    }
    :focus-visible { outline: 3px solid #ffbf47; outline-offset: 3px; }
    .skip {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 10px 14px;
      color: #fff;
      background: var(--deep);
      border-radius: 10px;
      transform: translateY(-150%);
    }
    .skip:focus { transform: translateY(0); }
    .shell { width: min(1040px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 78px 0 46px; }
    .label {
      display: inline-block;
      margin-bottom: 14px;
      padding: 5px 11px;
      color: var(--navy);
      background: #e8f3fe;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
    }
    h1 {
      margin: 0;
      color: var(--deep);
      font-size: clamp(38px, 7vw, 68px);
      line-height: 1.08;
      letter-spacing: -.05em;
    }
    .intro {
      max-width: 660px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2.2vw, 20px);
    }
    main { padding-bottom: 80px; }
    .section-title { margin: 0 0 18px; font-size: 22px; letter-spacing: -.02em; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      display: flex;
      min-height: 270px;
      flex-direction: column;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 16px 36px rgba(11,40,71,.1);
    }
    .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--navy), var(--blue));
      border-radius: 15px;
      font-size: 21px;
      font-weight: 900;
    }
    .status {
      padding: 5px 9px;
      color: #176f5c;
      background: #e4f8f2;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
    }
    .card h2 { margin: 22px 0 8px; color: var(--deep); font-size: 24px; letter-spacing: -.03em; }
    .card p { margin: 0 0 24px; color: var(--muted); }
    .button {
      display: inline-flex;
      min-height: 48px;
      margin-top: auto;
      padding: 11px 18px;
      align-items: center;
      justify-content: center;
      align-self: flex-start;
      color: #fff;
      background: var(--navy);
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease;
    }
    .button:hover { transform: translateY(-2px); background: var(--deep); }
    .coming {
      border-style: dashed;
      box-shadow: none;
      background: rgba(255,255,255,.55);
    }
    .coming .icon { color: var(--blue); background: #e8f3fe; }
    .coming p { margin-bottom: 0; }
    footer { padding: 24px 0 34px; color: var(--muted); font-size: 14px; }
    @media (max-width: 680px) {
      .shell { width: min(100% - 22px, 1040px); }
      header { padding: 52px 0 34px; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 0; padding: 22px; }
      .button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>
  <header class="shell">
    <span class="label">JISIK.TBUCKS.XYZ</span>
    <h1>지식샘터<br>자료 허브</h1>
    <p class="intro">연수에 필요한 사전 준비와 실습 자료를 한곳에서 확인하세요. 새로운 자료는 이 허브에 차례로 추가됩니다.</p>
  </header>
  <main id="main" class="shell">
    <h2 class="section-title">현재 이용 가능한 자료</h2>
    <div class="grid">
      <article class="card">
        <div class="card-top">
          <span class="icon" aria-hidden="true">B</span>
          <span class="status">이용 가능</span>
        </div>
        <h2>Brisk Teaching 사전 준비</h2>
        <p>Chrome 설치부터 Brisk 교사용 가입과 작동 확인까지 순서대로 준비합니다.</p>
        <a class="button" href="./brisk/">사전 준비 시작하기&nbsp; →</a>
      </article>
      <article class="card coming" aria-label="추가 자료 준비 중">
        <div class="card-top">
          <span class="icon" aria-hidden="true">+</span>
          <span class="status">업데이트 예정</span>
        </div>
        <h2>새로운 연수 자료</h2>
        <p>앞으로 추가되는 사전 준비·실습 페이지가 이곳에 표시됩니다.</p>
      </article>
    </div>
  </main>
  <footer class="shell">지식샘터 연수 자료 · tbucks.xyz</footer>
</body>
</html>
